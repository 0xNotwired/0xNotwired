<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" role="img" aria-labelledby="title desc">
  <title id="title">0xNotwired — from bytes to behavior</title>
  <desc id="desc">A dark terminal with amber and lavender accents. Cybersecurity, low-level programming, malware analysis and reverse engineering. A small assembly listing connects source code, instructions, memory and behavior.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#211c2b"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" fill="none" stroke="#b6a4d0" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e8a838"/>
      <stop offset=".6" stop-color="#b7a0df"/>
      <stop offset="1" stop-color="#77c9b2"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1038" height="398" rx="18" fill="url(#background)" stroke="#453b52"/>
  <rect x="1" y="47" width="1038" height="334" fill="url(#grid)"/>
  <path d="M1 47H1039" stroke="#453b52"/>
  <circle cx="25" cy="25" r="5" fill="#c8798e"/>
  <circle cx="44" cy="25" r="5" fill="#e8a838"/>
  <circle cx="63" cy="25" r="5" fill="#77c9b2"/>

  <g font-family="'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace">
    <text x="88" y="30" font-size="12" fill="#b6a9c7">0xNotwired@lab: ~</text>
    <text x="1009" y="30" text-anchor="end" font-size="11" letter-spacing="2" fill="#b6a9c7">SOURCE / BINARY / BEHAVIOR</text>

    <text x="40" y="92" font-size="14" fill="#77c9b2">$ whoami</text>
    <text x="36" y="157" font-size="56" font-weight="700" letter-spacing="-2" fill="#f5e6cd">0xNotwired<tspan fill="#e8a838">_</tspan></text>
    <text x="40" y="195" font-size="16" fill="#c7b8d9">From source to assembly.</text>
    <text x="40" y="220" font-size="16" fill="#c7b8d9">From bytes to behavior.</text>

    <rect x="40" y="251" width="174" height="29" rx="5" fill="#e8a838" fill-opacity=".08" stroke="#6c5334"/>
    <text x="127" y="270" text-anchor="middle" font-size="12" fill="#f1c77f">CYBERSECURITY</text>
    <rect x="224" y="251" width="251" height="29" rx="5" fill="#b7a0df" fill-opacity=".07" stroke="#524460"/>
    <text x="349.5" y="270" text-anchor="middle" font-size="12" fill="#d1bdec">LOW-LEVEL PROGRAMMING</text>
    <rect x="40" y="290" width="174" height="29" rx="5" fill="#b7a0df" fill-opacity=".07" stroke="#524460"/>
    <text x="127" y="309" text-anchor="middle" font-size="12" fill="#d1bdec">MALWARE ANALYSIS</text>
    <rect x="224" y="290" width="251" height="29" rx="5" fill="#77c9b2" fill-opacity=".06" stroke="#36554f"/>
    <text x="349.5" y="309" text-anchor="middle" font-size="12" fill="#9dd8c8">REVERSE ENGINEERING</text>

    <rect x="554" y="76" width="446" height="248" rx="10" fill="#11131b" stroke="#3d354b"/>
    <text x="576" y="105" font-size="12" fill="#b6a9c7">; follow the execution</text>
    <path d="M555 119H999" stroke="#302a3b"/>
    <text x="576" y="146" font-size="12" fill="#d6a85c">0x00401000</text>
    <text x="681" y="146" font-size="12" fill="#8f829f">55</text>
    <text x="812" y="146" font-size="12" fill="#e5d5bd">push rbp</text>
    <text x="576" y="172" font-size="12" fill="#d6a85c">0x00401001</text>
    <text x="681" y="172" font-size="12" fill="#8f829f">48 89 e5</text>
    <text x="812" y="172" font-size="12" fill="#e5d5bd">mov rbp, rsp</text>
    <rect x="567" y="182" width="420" height="26" rx="4" fill="#e8a838" fill-opacity=".07"/>
    <text x="576" y="199" font-size="12" fill="#e8a838">0x00401004</text>
    <text x="681" y="199" font-size="12" fill="#b6a9c7">48 83 ec 20</text>
    <text x="812" y="199" font-size="12" fill="#f1c77f">sub rsp, 0x20</text>
    <text x="576" y="230" font-size="12" fill="#77c9b2">; inspect. question. understand.</text>

    <path d="M577 250H977" stroke="#302a3b"/>
    <text x="576" y="274" font-size="11" fill="#b6a9c7">SOURCE</text>
    <text x="684" y="274" font-size="11" fill="#b6a9c7">INSTRUCTIONS</text>
    <text x="842" y="274" font-size="11" fill="#b6a9c7">MEMORY</text>
    <path d="M628 270H671m-4-4 4 4-4 4M791 270H828m-4-4 4 4-4 4" fill="none" stroke="#b7a0df"/>
    <text x="576" y="305" font-size="12" fill="#e8a838">&gt; understand the behavior</text>

    <path d="M40 347H1000" stroke="#3d354b"/>
    <text x="40" y="375" font-size="11" letter-spacing="1.5" fill="#b6a9c7">CURIOSITY AT THE INSTRUCTION LEVEL</text>
    <text x="1000" y="375" text-anchor="end" font-size="11" fill="#b6a9c7">C / Python / Linux</text>
  </g>
  <path d="M20 398H1020" stroke="url(#accent)" stroke-width="2"/>
</svg>
